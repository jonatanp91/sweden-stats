# Bygger sajten och publicerar den på GitHub Pages vid varje push till main (eller manuellt).
# Datan hämtas INTE här – den ligger incheckad i src/data/datasets/ och public/data/ (se CLAUDE.md).
# Engångsinställning i GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicera på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# En publicering i taget; en pågående avbryts inte (så att en halvfärdig publicering inte lämnas kvar).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check

      # configure-pages ger sajtens adress (origin) och undersökväg (base_path, t.ex. /sweden-stats).
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
